name: Wohnungsagent – Telegram Watchdog

on:
  schedule:
    # Alle 15 Minuten (UTC). GitHub kann geplante Starts verzoegern.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Telegram testen oder Pipeline-Zustand pruefen'
        required: true
        type: choice
        default: test
        options:
          - test
          - check

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: wohnungsagent-telegram-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliotheken installieren
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.28,<3' 'requests>=2.31,<3'

      - name: Skriptsyntax prüfen
        run: python -m py_compile scripts/telegram_watchdog.py scripts/watchdog_checks.py

      - name: Monitoring-Regressionstests
        run: python -m unittest discover -s tests -p 'test_watchdog*.py' -v

      - name: Konfiguration prüfen
        id: config
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID fehlt."
            exit 1
          fi
          if [ "$MODE" = "check" ] && [ -z "$GOOGLE_SA" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON fehlt: geplante Checks sind noch nicht aktiviert."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON fehlt. Watchdog-Checks können noch nicht gestartet werden."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Telegram testen oder Pipeline prüfen
        if: steps.config.outputs.ready == 'true'
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/telegram_watchdog.py --mode "$MODE"
