name: Wohnungsagent – Telegram Watchdog

on:
  schedule:
    # Alle 15 Minuten (UTC). GitHub kann geplante Starts verzoegern.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Telegram testen oder Pipeline-Zustand pruefen'
        required: true
        type: choice
        default: test
        options:
          - test
          - check

permissions:
  contents: read
  issues: write

concurrency:
  group: wohnungsagent-telegram-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliotheken installieren
        run: python -m pip install --disable-pip-version-check 'google-auth>=2.28,<3' 'requests>=2.31,<3'

      - name: Skriptsyntax prüfen
        run: python -m py_compile scripts/telegram_watchdog.py

      - name: Konfiguration prüfen
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID fehlt."
            exit 1
          fi
          if [ "$MODE" = "check" ] && [ -z "$GOOGLE_SA" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON fehlt. Watchdog-Checks können noch nicht gestartet werden."
            exit 1
          fi

      - name: Telegram testen oder Pipeline prüfen
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/telegram_watchdog.py --mode "$MODE"
