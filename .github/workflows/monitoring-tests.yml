name: Wohnungsagent – Monitoring Tests

on:
  pull_request:
    paths:
      - 'scripts/telegram_watchdog.py'
      - 'scripts/watchdog_checks.py'
      - 'scripts/telegram_listings.py'
      - 'tests/test_watchdog*.py'
      - '.github/workflows/monitoring-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/telegram_watchdog.py'
      - 'scripts/watchdog_checks.py'
      - 'scripts/telegram_listings.py'
      - 'tests/test_watchdog*.py'
      - '.github/workflows/monitoring-tests.yml'

permissions:
  contents: read

jobs:
  watchdog-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxcheck
        run: python -m py_compile scripts/telegram_watchdog.py scripts/watchdog_checks.py scripts/telegram_listings.py
      - name: Regressionstests
        run: python -m unittest discover -s tests -p 'test_watchdog*.py' -v
