name: Apps Script unit tests

on:
  push:
    branches:
      - main
      - docs/apps-script-ai-pipeline-design
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Apps Script syntax
        run: for file in apps-script/*.js; do node --check "$file"; done
      - name: Run unit tests
        run: node --test tests/*.test.cjs
